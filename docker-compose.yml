services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: kennedy
      POSTGRES_USER: kennedy
      POSTGRES_PASSWORD: kennedy_dev_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
      

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata: